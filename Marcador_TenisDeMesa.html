<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcador PRO — Tenis de Mesa</title>
<style>
  /* Base y Reset */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-app:        #0f172a;
    --bg-card:       #1e293b;
    --text-main:     #f8fafc;
    --text-muted:    #94a3b8;
    --border-color:  #334155;

    /* Identidad Jugadores */
    --p1-main:       #3b82f6; 
    --p1-bg:         rgba(59, 130, 246, 0.12);
    --p1-border:     rgba(59, 130, 246, 0.4);
    --p1-glow:       0 0 20px rgba(59, 130, 246, 0.3);

    --p2-main:       #f97316; 
    --p2-bg:         rgba(249, 115, 22, 0.12);
    --p2-border:     rgba(249, 115, 22, 0.4);
    --p2-glow:       0 0 20px rgba(249, 115, 22, 0.3);

    --win-color:     #10b981;
    --alert-color:   #ef4444;
    --radius:        20px;
  }

  body {
    background: var(--bg-app);
    color: var(--text-main);
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    overflow-x: hidden;
  }

  /* Animaciones Keyframes */
  @keyframes pulseGlow { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
  @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes slideScore { 0% { transform: translateY(-10px); opacity: 0.5; } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes flashDeuce { 0%, 100% { background: rgba(239, 68, 68, 0.1); color: var(--alert-color); } 50% { background: rgba(239, 68, 68, 0.3); color: #fff; } }

  /* Cabecera */
  header { text-align: center; margin-bottom: 2rem; animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
  header h1 { font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; }
  header p { font-size: 14px; color: var(--text-muted); margin-top: 6px; font-weight: 500; }

  /* Contenedor Principal */
  .card {
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius);
    width: 100%; max-width: 700px; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Entradas de Nombres */
  .names-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; margin-bottom: 1.5rem; align-items: center; }
  .name-input {
    background: transparent; border: none; border-bottom: 2px solid var(--border-color);
    padding: 10px 5px; font-size: 20px; font-weight: 700; color: var(--text-main);
    width: 100%; text-align: center; outline: none; transition: all 0.3s;
  }
  .theme-p1-text:focus { border-bottom-color: var(--p1-main); box-shadow: 0 10px 10px -10px var(--p1-main); }
  .theme-p2-text:focus { border-bottom-color: var(--p2-main); box-shadow: 0 10px 10px -10px var(--p2-main); }
  .vs-label { font-size: 14px; font-weight: 800; color: var(--border-color); }

  /* Historial de Sets */
  .sets-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding: 0 1rem; }
  .set-dots { display: flex; gap: 10px; }
  .set-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border-color); transition: all 0.4s; }
  .theme-p1-dots .set-dot.won { background: var(--p1-main); border-color: var(--p1-main); box-shadow: var(--p1-glow); }
  .theme-p2-dots .set-dot.won { background: var(--p2-main); border-color: var(--p2-main); box-shadow: var(--p2-glow); }
  .set-label-center { font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }

  /* Marcador y Paneles */
  .scoreboard { display: grid; grid-template-columns: 1fr 2px 1fr; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border-color); margin-bottom: 1.5rem; background: var(--bg-app); }
  .divider-col { background: var(--border-color); }

  .score-panel { display: flex; flex-direction: column; align-items: center; padding: 3rem 1rem 2.5rem; position: relative; transition: background 0.5s ease; }
  .score-panel.theme-p1 { background: var(--p1-bg); }
  .score-panel.theme-p2 { background: var(--p2-bg); }

  /* Saque */
  .service-indicator { position: absolute; top: 20px; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; opacity: 0; transition: opacity 0.3s; }
  .score-panel.serving .service-indicator { opacity: 1; background: var(--win-color); color: #000; animation: pulseGlow 2s infinite; }
  .service-indicator::after { content: "SAQUE"; }

  /* Números */
  .score-num { font-size: 130px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 10px 20px rgba(0,0,0,0.5); user-select: none; transition: color 0.3s; }
  .score-panel.theme-p1 .score-num { color: var(--p1-main); }
  .score-panel.theme-p2 .score-num { color: var(--p2-main); }
  .score-num.bump { animation: slideScore 0.15s ease-out; }

  /* Botones */
  .btn-row { display: flex; gap: 20px; margin-top: 25px; }
  .btn-pt { width: 65px; height: 65px; border-radius: 50%; border: none; font-size: 32px; font-weight: 300; cursor: pointer; color: #fff; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .btn-pt:active { transform: scale(0.85); }
  .theme-p1 .btn-pt { background: var(--p1-main); box-shadow: 0 8px 15px rgba(59, 130, 246, 0.3); }
  .theme-p2 .btn-pt { background: var(--p2-main); box-shadow: 0 8px 15px rgba(249, 115, 22, 0.3); }
  .btn-pt.minus { width: 45px; height: 45px; font-size: 24px; background: transparent !important; border: 2px solid currentColor; box-shadow: none !important; }
  .theme-p1 .btn-pt.minus { color: var(--p1-main); }
  .theme-p2 .btn-pt.minus { color: var(--p2-main); }

  /* Barra de Estado */
  .status { text-align: center; font-size: 16px; font-weight: 700; padding: 12px; border-radius: 12px; margin-bottom: 1.5rem; min-height: 48px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; border: 1px solid transparent; letter-spacing: 0.5px; }
  .status.normal { color: var(--text-muted); background: var(--bg-app); }
  .status.highlight { color: #000; background: var(--win-color); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
  .status.deuce { animation: flashDeuce 1.5s infinite; border-color: var(--alert-color); font-size: 18px; letter-spacing: 2px; }
  .status.advantage { color: var(--p2-main); background: var(--p2-bg); border-color: var(--p2-border); }

  /* Historial de resultados */
  .history { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 2rem; }
  .set-chip { background: var(--bg-app); border: 1px solid var(--border-color); border-radius: 20px; padding: 8px 16px; font-size: 14px; font-weight: 500; }

  /* Acciones inferiores */
  .actions { display: flex; gap: 15px; justify-content: center; }
  .btn-action { padding: 14px 28px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
  .btn-action:active { transform: translateY(3px); }
  .btn-action.primary { background: var(--text-main); color: var(--bg-app); }
  .btn-action.success { background: var(--win-color); color: #000; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }
  .btn-action.hidden { display: none; }

  /* Canvas Confeti */
  #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
  .ico { width:22px; height:22px; stroke: currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<header>
  <h1>
    <svg class="ico" style="stroke: var(--p2-main);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
    Tenis de Mesa
  </h1>
  <p>Saque cada 2 pts • Diferencia de 2 en Deuce (10-10)</p>
</header>

<div class="card">
  <div class="names-row">
    <!-- IDs Neutros (left/right) en lugar de fijos (a/b) -->
    <input class="name-input theme-p1-text" id="name-left" value="Jugador 1" oninput="render()" autocomplete="off">
    <div class="vs-label">VS</div>
    <input class="name-input theme-p2-text" id="name-right" value="Jugador 2" oninput="render()" autocomplete="off">
  </div>

  <div class="sets-row">
    <div class="set-dots" id="dots-a"></div>
    <div class="set-label-center" id="set-label-center">Set 1</div>
    <div class="set-dots" id="dots-b"></div>
  </div>

  <div class="scoreboard">
    <div class="score-panel" id="panel-a">
      <div class="service-indicator"></div>
      <div class="score-num" id="score-a">0</div>
      <div class="btn-row">
        <button class="btn-pt minus" title="Restar">-</button>
        <button class="btn-pt" title="Sumar">+</button>
      </div>
    </div>
    <div class="divider-col"></div>
    <div class="score-panel" id="panel-b">
      <div class="service-indicator"></div>
      <div class="score-num" id="score-b">0</div>
      <div class="btn-row">
        <button class="btn-pt" title="Sumar">+</button>
        <button class="btn-pt minus" title="Restar">-</button>
      </div>
    </div>
  </div>

  <div class="status normal" id="status"></div>
  <div class="history" id="history"></div>

  <div class="actions">
    <button class="btn-action success hidden" id="btn-next" onclick="nextSet()">
      Cambiar Lado y Siguiente Set
      <svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
    <button class="btn-action primary" onclick="resetMatch()">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      Reiniciar
    </button>
  </div>
</div>

<script>
let state = {
  scores: [0, 0], setsWon: [0, 0], history: [],
  currentSet: 1, matchOver: false, setOver: false, swapped: false
};

function getSetWinner(a, b) {
  if (a >= 11 && a - b >= 2) return 0;
  if (b >= 11 && b - a >= 2) return 1;
  return null;
}

function getServerIdx(s0, s1) {
  const total = s0 + s1;
  if (s0 >= 10 && s1 >= 10) return total % 2 === 0 ? 0 : 1;
  return Math.floor(total / 2) % 2 === 0 ? 0 : 1;
}

function addPoint(playerIdx, delta) {
  if (state.matchOver) return;
  if (state.setOver && delta > 0) return;
  
  state.scores[playerIdx] = Math.max(0, state.scores[playerIdx] + delta);
  const w = getSetWinner(state.scores[0], state.scores[1]);
  state.setOver = w !== null;

  if (delta > 0) {
    const panelSide = (playerIdx === 0) !== state.swapped ? 'a' : 'b';
    const el = document.getElementById('score-' + panelSide);
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  render();
}

function nextSet() {
  const [s0, s1] = state.scores;
  const winner = getSetWinner(s0, s1);
  if (winner === null) return;
  
  state.setsWon[winner]++;
  state.history.push([s0, s1]);
  state.scores = [0, 0];
  state.currentSet++;
  state.setOver = false;
  state.swapped = !state.swapped;

  // CORRECCIÓN PRINCIPAL: Invertimos físicamente el texto en el DOM
  const inputLeft = document.getElementById('name-left');
  const inputRight = document.getElementById('name-right');
  const temp = inputLeft.value;
  inputLeft.value = inputRight.value;
  inputRight.value = temp;

  if (state.setsWon[0] === 2 || state.setsWon[1] === 2) {
    state.matchOver = true;
    launchConfetti();
  }
  render();
}

function resetMatch() {
  state = { scores:[0,0], setsWon:[0,0], history:[], currentSet:1, matchOver:false, setOver:false, swapped:false };
  // Reiniciar campos a valor por defecto
  document.getElementById('name-left').value = 'Jugador 1';
  document.getElementById('name-right').value = 'Jugador 2';
  stopConfetti();
  render();
}

function render() {
  const leftIdx  = state.swapped ? 1 : 0;
  const rightIdx = state.swapped ? 0 : 1;

  const iL = document.getElementById('name-left');
  const iR = document.getElementById('name-right');

  // Ajustar el color de foco del texto dinámicamente según el jugador que esté de ese lado
  iL.className = 'name-input ' + (leftIdx === 0 ? 'theme-p1-text' : 'theme-p2-text');
  iR.className = 'name-input ' + (rightIdx === 0 ? 'theme-p1-text' : 'theme-p2-text');

  // Mapeamos los nombres lógicos extraídos del DOM basándonos en si están invertidos o no
  const names = [];
  names[leftIdx] = iL.value || 'Jugador 1';
  names[rightIdx] = iR.value || 'Jugador 2';

  const [s0, s1] = state.scores;
  const winner = getSetWinner(s0, s1);
  const serverIdx = getServerIdx(s0, s1);

  document.getElementById('score-a').textContent = state.scores[leftIdx];
  document.getElementById('score-b').textContent = state.scores[rightIdx];
  document.getElementById('set-label-center').textContent = 'Set ' + state.currentSet;

  const pA = document.getElementById('panel-a');
  const pB = document.getElementById('panel-b');
  const dotsA = document.getElementById('dots-a');
  const dotsB = document.getElementById('dots-b');

  pA.className = 'score-panel ' + (leftIdx === 0 ? 'theme-p1' : 'theme-p2');
  pB.className = 'score-panel ' + (rightIdx === 0 ? 'theme-p1' : 'theme-p2');
  dotsA.className = 'set-dots ' + (leftIdx === 0 ? 'theme-p1-dots' : 'theme-p2-dots');
  dotsB.className = 'set-dots ' + (rightIdx === 0 ? 'theme-p1-dots' : 'theme-p2-dots');

  if (!state.setOver && !state.matchOver) {
    if (serverIdx === leftIdx) pA.classList.add('serving');
    if (serverIdx === rightIdx) pB.classList.add('serving');
  }

  pA.querySelector('.btn-pt.minus').setAttribute('onclick', `addPoint(${leftIdx},-1)`);
  pA.querySelector('.btn-pt:not(.minus)').setAttribute('onclick', `addPoint(${leftIdx},1)`);
  pB.querySelector('.btn-pt.minus').setAttribute('onclick', `addPoint(${rightIdx},-1)`);
  pB.querySelector('.btn-pt:not(.minus)').setAttribute('onclick', `addPoint(${rightIdx},1)`);

  [dotsA, dotsB].forEach((dotsEl, visPos) => {
    const logicalIdx = visPos === 0 ? leftIdx : rightIdx;
    const wonCount = state.setsWon[logicalIdx];
    dotsEl.innerHTML = '';
    for (let s = 0; s < 2; s++) {
      const d = document.createElement('div');
      d.className = 'set-dot ' + (s < wonCount ? 'won' : '');
      dotsEl.appendChild(d);
    }
  });

  const hist = document.getElementById('history');
  hist.innerHTML = '';
  state.history.forEach((h, i) => {
    const setWinName = h[0] > h[1] ? names[0] : names[1];
    const colorClass = h[0] > h[1] ? 'var(--p1-main)' : 'var(--p2-main)';
    hist.innerHTML += `<div class="set-chip">Set ${i+1}: <strong>${h[0]} - ${h[1]}</strong> <span style="color:${colorClass}">(${setWinName})</span></div>`;
  });

  const status = document.getElementById('status');
  const btnNext = document.getElementById('btn-next');

  if (state.matchOver) {
    status.innerHTML = `🏆 ¡${(state.setsWon[0] === 2 ? names[0] : names[1]).toUpperCase()} GANA EL PARTIDO!`;
    status.className = 'status highlight';
    btnNext.className = 'btn-action hidden';
  } else if (winner !== null) {
    status.innerHTML = `✅ ${winner === 0 ? names[0] : names[1]} asegura el set`;
    status.className = 'status highlight';
    btnNext.className = 'btn-action success';
  } else {
    btnNext.className = 'btn-action hidden';
    if (s0 >= 10 && s1 >= 10) {
      if (s0 === s1) { status.textContent = '🔥 DEUCE 🔥'; status.className = 'status deuce'; } 
      else { status.textContent = `⚡ VENTAJA: ${s0 > s1 ? names[0].toUpperCase() : names[1].toUpperCase()}`; status.className = 'status advantage'; }
    } else if (s0 === 10 || s1 === 10) {
      status.textContent = `🎯 Point para set (${s0 === 10 ? names[0] : names[1]})`; status.className = 'status normal';
    } else {
      status.textContent = state.swapped ? '🔄 Lados de mesa invertidos' : 'Partido en curso'; status.className = 'status normal';
    }
  }
}

// Lógica de confeti offline (Sin cambios)
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [], animId = null;

function launchConfetti() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  particles = Array.from({length: 200}, () => ({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height,
    w: Math.random() * 10 + 5, h: Math.random() * 6 + 3,
    c: ['#3b82f6','#f97316','#10b981','#facc15','#ec4899'][Math.floor(Math.random() * 5)],
    r: Math.random() * Math.PI * 2, vx: (Math.random() - 0.5) * 6, vy: Math.random() * 4 + 3,
    vr: (Math.random() - 0.5) * 0.2, l: 1
  }));
  if (animId) cancelAnimationFrame(animId);
  animateConfetti();
  setTimeout(stopConfetti, 6000);
}

function animateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let alive = false;
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.r += p.vr; p.l -= 0.004;
    if (p.y < canvas.height && p.l > 0) alive = true;
    ctx.save(); ctx.globalAlpha = Math.max(0, p.l); ctx.translate(p.x, p.y); ctx.rotate(p.r);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
  });
  if (alive) animId = requestAnimationFrame(animateConfetti);
  else stopConfetti();
}

function stopConfetti() { if (animId) { cancelAnimationFrame(animId); animId = null; } ctx.clearRect(0, 0, canvas.width, canvas.height); particles = []; }

render();
</script>
</body>
</html>
